	<style>

		body {
			font-family: 'Roboto', sans-serif;
		}

		.content > .section-block-padding-sm:last-of-type {
			padding-bottom: 10rem;
		}

		.events-filter-bar {
			display: block;
			padding-bottom: 6rem;
			background: transparent;
			border: none;
			text-align: center;
		}
		.events-filter-group {
			margin: 0;
		}
		.events-filter-label {
			display: none;
		}
		.events-filter-list {
			width: 100%;
			padding: 0;
			margin: 1.9rem 0 0 0 !important;
			list-style: none;
			text-align: center;
		}
		.events-filter-list li {
			display: inline-block;
			padding: 0.8rem 0;
			margin: 0 0.25rem;
			font-size: 1rem;
			line-height: 1;
			text-transform: none;
		}
		.events-filter-option {
			display: block;
			position: relative;
			padding: 10px 20px;
			color: var(--DarkGrey);
			background-color: var(--white);
			border: 1px solid var(--StrokeGrey);
			border-radius: 4px;
			cursor: pointer;
			transition: background 0.3s, border-color 0.3s, color 0.3s;
		}
		.events-filter-option:hover {
			background-color: var(--LightGrey);
		}
		.events-filter-option.active {
			background-color: var(--MAQRed);
			border: 1px solid var(--StrokeGrey);
			color: #fff;
		}
		#main-content.grid-container {
			position: static;
		}
		#main-content .row::before,
		#main-content .row::after {
			display: none !important;
			content: none !important;
		}
		#main-content .column {
			float: none !important;
		}

		#events-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 3rem;
			align-items: stretch;
		}
		#events-grid::before,
		#events-grid::after {
			display: none !important;
			content: none !important;
		}
		#events-grid .grid-item {
			width: auto !important;
			float: none !important;
			padding: 0 !important;
			margin: 0 !important;
			display: block;
		}
		#events-grid .grid-item.hidden {
			display: none;
		}
		#events-grid .grid-item .post {
			height: 100%;
			display: block;
			margin: 0;
		}
		.event-card.with-background {
			padding: 0;
			background: #fff;
			border-radius: 0.3rem;
			border: 1px solid var(--StrokeGrey);
			box-shadow: none;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			height: 100%;
		}
		.event-card .post-media {
			position: relative;
			margin: 0;
			padding: 16px;
			width: 100%;
			aspect-ratio: 1 / 1;
			box-sizing: border-box;
			flex-shrink: 0;
			background: #fff;
			overflow: hidden;
			display: grid;
			place-items: center;
		}
		.event-card .post-media > a {
			display: grid;
			place-items: center;
			width: 100%;
			height: 100%;
			line-height: 0;
		}
		.event-card .post-media > a > img.cs-image {
			max-width: 90% !important;
			max-height: 90% !important;
			width: auto !important;
			height: auto !important;
			object-fit: contain !important;
			object-position: center center !important;
			display: block;
			margin: 0 auto !important;
		}
		.event-card .event-card-body {
			display: flex;
			flex-direction: column;
			flex: 1;
			padding: 14px 16px 16px;
			text-align: left;
		}
		.event-card h2.post-title.post-noDesc-title {
			height: auto !important;
			min-height: 0 !important;
			padding: 0 !important;
			margin: 0 0 6px 0;
			font-size: 1.25rem;
			line-height: 1.3;
			background: transparent !important;
			overflow: visible;
		}
		.event-card h2.post-title.post-noDesc-title::before,
		.event-card h2.post-title.post-noDesc-title::after {
			display: none !important;
			content: none !important;
		}
		.event-card h2.post-title.post-noDesc-title a {
			color: #222;
		}
		.event-card .event-card-desc {
			padding: 0;
			margin: 0 0 4px 0;
			font-family: 'Roboto', sans-serif;
			font-size: 1rem;
			font-weight: 400;
			color: #666;
			line-height: 1.45;
			max-height: calc(1.45em * 2);
			overflow: hidden;
			transition: max-height 0.35s ease;
			flex-shrink: 0;
		}
		.event-card .event-card-desc.expanded {
			max-height: 300px;
		}
		.event-card .event-desc-more {
			display: none;
			padding: 0;
			margin: 4px 0 8px 0;
			font-family: 'Roboto', sans-serif;
			font-size: 1rem;
			font-weight: 400;
			color: var(--MAQRed);
			background: none;
			border: 0;
			cursor: pointer;
			line-height: 1.3;
			text-align: left;
			text-decoration: none;
		}
		.event-card .event-desc-more.is-visible {
			display: block;
		}
		.event-card .event-desc-more.is-visible:hover {
			color: #ba141a;
			text-decoration: none;
		}
		.event-card .event-card-meta {
			padding: 0;
			margin: 6px 0 0 0;
		}
		.event-card .event-card-meta p {
			margin: 0 0 2px 0;
			font-family: 'Roboto', sans-serif;
			font-size: 1rem;
			font-weight: 400;
			color: #666;
			line-height: 1.5;
			display: flex;
			align-items: baseline;
			flex-wrap: wrap;
		}
		.event-card .event-card-meta i {
			width: 15px;
			text-align: center;
			color: var(--MAQBlack);
			margin-right: 6px;
			font-size: 12px;
			flex-shrink: 0;
		}
		.event-card .event-card-time .ist-line {
			display: block;
			width: 100%;
			padding-left: 21px;
		}
		.event-card .read-more {
			display: flex;
			align-items: center;
			justify-content: flex-start;
			padding: 6px 0 0;
			margin-top: auto;
			font-family: 'Roboto', sans-serif;
			font-size: 1rem;
			font-weight: 600;
			color: var(--MAQRed);
			text-decoration: none;
			transition: color 0.3s ease;
		}
		.event-card .read-more .chevron {
			margin-left: 5px;
			transition: margin-left 0.3s ease;
		}
		.event-card .read-more:hover .chevron {
			margin-left: 10px;
		}
		.event-card .read-more:hover {
			color: var(--MAQRed);
		}
		.events-no-results {
			text-align: center;
			padding: 40px 20px;
			color: #666;
			display: none;
		}
		.events-pagination {
			margin: 32px 0 24px;
			padding: 0;
			text-align: center;
			display: flex;
			flex-direction: column;
			align-items: center;
		}
		#footer.footer {
			margin-top: 0;
		}
		.events-load-more {
			display: none;
			min-width: 128px;
			margin: 0 auto;
			padding: 10px 20px;
			font-family: 'Roboto', sans-serif;
			font-size: 1rem;
			font-weight: 400;
			color: #fff;
			background: var(--MAQRed);
			border: 2px solid var(--MAQRed);
			border-radius: 5px;
			cursor: pointer;
			transition: all 0.3s ease;
		}
		.events-load-more:hover {
			background: #fff;
			color: var(--MAQRed);
			border: 2px solid var(--MAQRed);
			font-weight: 400;
		}
		.events-load-more:disabled {
			cursor: not-allowed;
			opacity: 0.65;
		}
		.events-pagination-status {
			width: 100%;
			margin: 10px auto 0;
			font-size: 12.5px;
			color: #777;
			text-align: center;
		}

		@keyframes sk-shimmer {
			0%   { background-position: 200% 0; }
			100% { background-position: -200% 0; }
		}
		.sk-block {
			background: linear-gradient(90deg, #efefef 25%, #e2e2e2 50%, #efefef 75%);
			background-size: 200% 100%;
			animation: sk-shimmer 1.4s ease infinite;
			border-radius: 4px;
		}
		.sk-img {
			width: 100%;
			aspect-ratio: 1 / 1;
		}
		.sk-line {
			height: 13px;
			margin-bottom: 8px;
		}
		.sk-title {
			height: 18px;
			width: 75%;
			margin-bottom: 10px;
		}
		.sk-short {
			width: 55%;
		}

		@media only screen and (max-width: 768px) {
			#events-grid {
				grid-template-columns: 1fr;
			}
			.events-filter-bar {
				padding: 0;
			}
			.events-filter-group {
				margin: 0;
			}
		}
		@media only screen and (min-width: 769px) and (max-width: 1024px) {
			#events-grid {
				grid-template-columns: repeat(2, 1fr);
			}
		}
	</style>
</head>

			<div id="events-filter-bar" class="events-filter-bar grid-filter-menu center" role="group" aria-label="Filter events" style="display:none;"></div>

			<div id="events-loading" class="CaseStudyLoading" aria-label="Loading events" role="status">
